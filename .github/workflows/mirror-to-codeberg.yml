name: mirror-to-codeberg

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'zer0-id/Beacon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use the current major version and pin it to a full commit SHA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror all branches and tags to Codeberg
        env:
          MIRROR_KEY: ${{ secrets.MIRROR }}
        run: |
          set -euo pipefail

          # 1. Copy GitHub's branches into a private namespace (skips origin/HEAD)
          git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin |
          while read -r sha ref; do
            name="${ref#refs/remotes/origin/}"
            [ "$name" = "HEAD" ] && continue
            git update-ref "refs/mirror/heads/$name" "$sha"
          done

          # 2. Safety: refuse to prune against an empty or broken source
          git show-ref --verify --quiet refs/mirror/heads/main \
            || { echo "main not found, refusing to mirror"; exit 1; }

          # 3. SSH setup with a pinned host key
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$MIRROR_KEY" > "$HOME/.ssh/mirror_key"
          chmod 600 "$HOME/.ssh/mirror_key"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB
          EOF
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # 4. Push everything, delete what no longer exists on GitHub
          git remote add codeberg git@codeberg.org:0id/Beacon.git
          git push --prune codeberg \
            '+refs/mirror/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

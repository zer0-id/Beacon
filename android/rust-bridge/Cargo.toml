[package]
name = "rust-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_bridge"
crate-type = ["cdylib", "staticlib"] 

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
shared = { path = "../../core" }
uniffi = { version = "0.32.2", features = ["cli"] }
tokio = { workspace = true }

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }